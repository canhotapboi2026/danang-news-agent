name: Agent tin tức Đà Nẵng

on:
  schedule:
    # Repo PUBLIC: chạy miễn phí không giới hạn phút. 15 phút/lần.
    # (Nếu dùng repo PRIVATE thì đổi thành "*/30 * * * *" để không vượt 2.000 phút/tháng.)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nhập 1 để chạy thử, KHÔNG đăng Facebook thật"
        default: "0"
      check_facebook:
        description: "Nhập 1 để chỉ KIỂM TRA token Facebook (không đăng, không chạy agent)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: news-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài công cụ ảnh (ffmpeg, font tiếng Việt, Pillow) nếu còn thiếu
        # Không bắt buộc: nếu bước này lỗi, agent vẫn chạy (chỉ không tạo được ảnh dự phòng).
        continue-on-error: true
        run: |
          need=""
          command -v ffmpeg >/dev/null || need="$need ffmpeg"
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || need="$need fonts-dejavu-core"
          if [ -n "$need" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends $need
          fi
          python -c "import PIL" 2>/dev/null || pip install --quiet pillow
          echo "--- Kiểm tra công cụ ---"
          ffmpeg -version | head -1
          ls /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          python -c "import PIL; print('Pillow', PIL.__version__)"

      - name: Kiểm tra token Facebook (chỉ khi chọn check_facebook = 1)
        if: github.event.inputs.check_facebook == '1'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python -m agent.facebook

      - name: Chạy agent
        if: github.event.inputs.check_facebook != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python -m agent.main

      - name: Lưu trạng thái (tránh đăng trùng ở lần sau)
        if: always()
        run: |
          git config user.name "news-agent"
          git config user.email "news-agent@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "cập nhật trạng thái" && git push)
